
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project
        run: |
          unzip -o .github/workflows/barnameyar-android.zip -d .
          ls -la barnameyar-android

      - name: Install dependencies
        working-directory: barnameyar-android
        run: npm install

      - name: Create Android project
        working-directory: barnameyar-android
        run: npx cap add android

      - name: Apply icons
        working-directory: barnameyar-android
        run: bash scripts/apply-icons.sh

      - name: Sync Android
        working-directory: barnameyar-android
        run: npx cap sync android

      - name: Build APK
        working-directory: barnameyar-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ario-APK
          path: barnameyar-android/android/app/build/outputs/apk/debug/app-debug.apk
          
